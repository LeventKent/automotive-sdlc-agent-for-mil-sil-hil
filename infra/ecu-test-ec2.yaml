AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Provisions an Ubuntu 22.04 EC2 instance with ECU_TEST installed,
  Python 3.11 configured, and workspace directories created for
  remote ecu.test execution.

Parameters:
  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Name of an existing EC2 key pair for SSH access

  AllowedSSHCidr:
    Type: String
    Description: CIDR range allowed for inbound SSH (e.g. 203.0.113.0/32)
    AllowedPattern: '(\d{1,3}\.){3}\d{1,3}/\d{1,2}'
    ConstraintDescription: Must be a valid CIDR block (e.g. 203.0.113.0/32)

  InstanceType:
    Type: String
    Default: t3.large
    Description: EC2 instance type (minimum 2 vCPU, 8 GiB RAM)

  EcuTestDebUrl:
    Type: String
    Description: URL to the ECU_TEST .deb package for download and installation

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/22.04/stable/current/amd64/hvm/ebs-gp2/ami-id
    Description: SSM parameter path for Ubuntu 22.04 AMI (auto-resolves to latest)

Resources:
  WaitConditionHandle:
    Type: AWS::CloudFormation::WaitConditionHandle

  WaitCondition:
    Type: AWS::CloudFormation::WaitCondition
    DependsOn: EC2Instance
    Properties:
      Handle: !Ref WaitConditionHandle
      Timeout: '600'

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for ECU-TEST remote execution instance
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedSSHCidr

  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyPairName
      ImageId: !Ref LatestAmiId
      SecurityGroupIds:
        - !GetAtt SecurityGroup.GroupId
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          exec > /var/log/ecu-test-init.log 2>&1

          # Signal failure to CloudFormation on any error
          trap 'cfn-signal -e 1 --reason "UserData script failed" --url "${WaitConditionHandle}" 2>/dev/null || true' ERR

          apt-get update
          apt-get install -y python3-pip python3-setuptools software-properties-common build-essential

          # Install aws-cfn-bootstrap for cfn-signal
          apt-get install -y python3-pip
          pip3 install https://s3.amazonaws.com/cloudformation-examples/aws-cfn-bootstrap-py3-latest.tar.gz

          # Install Python 3.11 and requests
          add-apt-repository -y ppa:deadsnakes/ppa
          apt-get update
          apt-get install -y python3.11 python3.11-venv python3.11-distutils
          python3.11 -m ensurepip --upgrade
          python3.11 -m pip install requests

          # Download and install ECU_TEST .deb package
          curl -fSL -o /tmp/ecu-test.deb '${EcuTestDebUrl}'
          dpkg -i /tmp/ecu-test.deb || true
          apt-get install -f -y
          rm -f /tmp/ecu-test.deb

          # Create /opt/ecu.test symlink to the versioned install directory.
          # The remote scripts resolve ApiClient from /opt/ecu.test/Templates/ApiClient.
          ECU_TEST_DIR=$(find /opt -maxdepth 1 -type d -name 'ecu.test-*' | sort -V | tail -1)
          if [ -n "$ECU_TEST_DIR" ]; then
            ln -sfn "$ECU_TEST_DIR" /opt/ecu.test
          fi

          # Create directories
          mkdir -p /opt/ecu-test-scripts
          chmod 755 /opt/ecu-test-scripts

          mkdir -p /opt/ecu-test-workspace
          chmod 777 /opt/ecu-test-workspace

          echo "ECU-TEST init complete" >> /var/log/ecu-test-init.log

          # Signal success to CloudFormation
          cfn-signal -e 0 --reason "UserData completed successfully" --url "${WaitConditionHandle}"

Outputs:
  InstancePublicIp:
    Description: Public IPv4 address of the ECU-TEST instance
    Value: !GetAtt EC2Instance.PublicIp

  InstancePublicDns:
    Description: Public DNS hostname of the ECU-TEST instance
    Value: !GetAtt EC2Instance.PublicDnsName

  InstanceId:
    Description: EC2 instance ID
    Value: !Ref EC2Instance
